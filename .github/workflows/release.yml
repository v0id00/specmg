name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          NAME="specmg_${GITHUB_REF_NAME#v}_${GOOS}_${GOARCH}"
          mkdir -p dist/"$NAME"
          go build -trimpath -ldflags="-s -w" -o dist/"$NAME"/specmg"$EXT" ./cmd/specmg
          cp README.md dist/"$NAME"/
          if [ "$ARCHIVE" = "zip" ]; then
            (cd dist && zip -qr "$NAME.zip" "$NAME")
          else
            tar -C dist -czf dist/"$NAME.tar.gz" "$NAME"
          fi
          rm -rf dist/"$NAME"
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
